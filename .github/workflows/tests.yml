name: Run Tests

on: [push]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-22.04

    steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
              python-version: '3.12'

        - name: install dependencies
          run: |
              pip install -r requirements.txt -r dev-requirements.txt

        - name: Run pytest
          run: python -m pytest -vvv .